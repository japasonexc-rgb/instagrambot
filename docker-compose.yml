services:
  app:
    build: .
    ports:
      - "8081:8081"
    environment:
      HTTP_ADDR: ":8081"
      DB_DRIVER: "postgres"
      DB_DSN: "postgres://instagrampanel:instagrampanel@postgres:5432/instagrampanel?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      CORS_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_data:/app/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: instagrampanel
      POSTGRES_PASSWORD: instagrampanel
      POSTGRES_DB: instagrampanel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instagrampanel"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  app_data:
  postgres_data:
